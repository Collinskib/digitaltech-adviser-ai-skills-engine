name: auto-retry

# Bounded automatic retry: when a daily run fails, re-dispatch it — at most
# MAX_ATTEMPTS runs of daily.yml per calendar day (the bound is counted from
# actual run history, so the chain can never loop forever).
#
# Slot-level failures inside a run are also retried: the next dispatched run
# resumes retryable jobs from data/jobs in the site repo.

on:
  workflow_run:
    workflows: ["daily-content-engine"]
    types: [completed]

permissions:
  contents: read
  actions: write        # needed to dispatch daily.yml

env:
  MAX_ATTEMPTS: 3

jobs:
  maybe-retry:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Evaluate retry budget and re-dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%F)
          # count today's daily.yml runs — each dispatch is a new run, so
          # counting run history is the tamper-proof attempt bound
          RUNS_TODAY=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow daily.yml --created "${TODAY}T00:00:00Z" \
            --json databaseId,conclusion,event \
            --jq 'length')
          FAILED_TODAY=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow daily.yml --created "${TODAY}T00:00:00Z" \
            --json databaseId,conclusion,event \
            --jq '[.[] | select(.conclusion == "failure")] | length')
          echo "today=$TODAY runs=$RUNS_TODAY failed=$FAILED_TODAY max=$MAX_ATTEMPTS trigger=$TRIGGER_EVENT"
          if [ "$RUNS_TODAY" -ge "$MAX_ATTEMPTS" ]; then
            echo "attempt budget exhausted for $TODAY — not re-dispatching"
            exit 0
          fi
          NEXT=$((RUNS_TODAY + 1))
          echo "dispatching attempt $NEXT for $TODAY (trigger: $TRIGGER_EVENT)"
          sleep 20   # settle delay; job-level backoff lives in the engine
          gh workflow run daily.yml \
            --repo "$GITHUB_REPOSITORY" \
            -f publish_mode=publish \
            -f max_articles=1 \
            -f attempt=$NEXT \
            -f reason="auto-retry-$NEXT"
