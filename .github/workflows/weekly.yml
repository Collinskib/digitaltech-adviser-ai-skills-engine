name: weekly-review

# Sunday GSC/GA4 feedback loop — data-only updates to the site repo
# (topic registry proposals, internal-link backlog, review report).
# It never creates or edits article files.

on:
  schedule:
    - cron: "0 6 * * 0"   # Sundays 06:00 UTC = 09:00 Africa/Nairobi
  workflow_dispatch:

concurrency:
  group: dta-engine
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_GSC: ${{ secrets.CLDSEO_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --no-input -r requirements.txt
      - if: env.HAS_GSC == 'true'
        run: pip install --no-input google-api-python-client google-auth
      - name: Install Devin CLI + credentials
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_CREDENTIALS_TOML: ${{ secrets.DEVIN_CREDENTIALS_TOML }}
        run: |
          bash scripts/setup-devin.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run weekly review
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_CREDENTIALS_TOML: ${{ secrets.DEVIN_CREDENTIALS_TOML }}
          SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
          CLDSEO_SERVICE_ACCOUNT_JSON: ${{ secrets.CLDSEO_SERVICE_ACCOUNT_JSON }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_REPO: ${{ vars.SITE_REPO || 'Collinskib/digitaltechadviser' }}
          SITE_BRANCH: ${{ vars.SITE_BRANCH || 'master' }}
          DEVIN_MODEL: ${{ vars.DEVIN_MODEL || '' }}
          DEVIN_PERMISSION_MODE: ${{ vars.DEVIN_PERMISSION_MODE || 'dangerous' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
        run: python -m engine weekly-review
