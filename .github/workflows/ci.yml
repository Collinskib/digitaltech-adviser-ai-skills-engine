name: ci

# Lint + unit/integration tests. Needs no secrets — the devin CLI is stubbed
# and the site repo is replaced by a local fixture, so untrusted PR code can
# never touch credentials or the production repo.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + a rasterizer for image tests
        run: |
          pip install --no-input -r requirements-dev.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
      - name: Lint
        run: ruff check engine tests
      - name: Test (stub devin, local site fixture)
        run: pytest -v --tb=short
