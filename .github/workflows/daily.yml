name: daily-content-engine

# Autonomous daily run: Devin CLI agents research, write, edit and publish
# up to ENGINE_MAX_ARTICLES articles to digitaltechadviser.com via git push
# (Cloudflare Workers Builds deploys the site).
#
# Secrets live in env only for the run step. Nothing is uploaded as an
# artifact — the site repo is the only content destination.

on:
  # Daily schedule ships DISABLED — uncomment after the pipeline has passed
  # a draft-mode + publish-mode verification run (see docs/DEPLOYMENT.md).
  # schedule:
  #   # 05:00 UTC = 08:00 Africa/Nairobi (no DST). Edit to change cadence.
  #   - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      publish_mode:
        description: "publish | draft"
        type: choice
        options: [publish, draft]
        default: publish
      max_articles:
        description: "articles to attempt (1-3; quality gate may yield fewer/0)"
        type: choice
        options: ["1", "2", "3"]
        default: "1"
      dry_run:
        description: "full pipeline, but never push (validation mode)"
        type: boolean
        default: false
      attempt:
        description: "run attempt number (auto-retry sets >1)"
        type: number
        default: 1
      reason:
        description: "why this run was triggered"
        type: string
        default: manual

concurrency:
  group: dta-engine
  cancel-in-progress: false

permissions:
  contents: read      # engine repo only; site repo uses SITE_REPO_TOKEN
  issues: write       # failure notification issues on THIS repo only

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # secrets can't be referenced inside if: conditions — surface as job env
      HAS_GSC: ${{ secrets.CLDSEO_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node (site build verification)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Python deps
        run: pip install --no-input -r requirements.txt

      - name: Install GSC deps (only when GSC secret configured)
        if: env.HAS_GSC == 'true'
        run: pip install --no-input google-api-python-client google-auth

      - name: Install SVG rasterizer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin

      - name: Install Devin CLI + credentials
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_CREDENTIALS_TOML: ${{ secrets.DEVIN_CREDENTIALS_TOML }}
        run: |
          bash scripts/setup-devin.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pre-flight check
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
          SITE_REPO: ${{ vars.SITE_REPO || 'Collinskib/digitaltechadviser' }}
        run: python -m engine check-setup

      - name: Run pipeline
        id: run
        env:
          # --- secrets ---
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_CREDENTIALS_TOML: ${{ secrets.DEVIN_CREDENTIALS_TOML }}
          SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
          CLDSEO_SERVICE_ACCOUNT_JSON: ${{ secrets.CLDSEO_SERVICE_ACCOUNT_JSON }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- configuration (vars with safe fallbacks) ---
          SITE_REPO: ${{ vars.SITE_REPO || 'Collinskib/digitaltechadviser' }}
          SITE_BRANCH: ${{ vars.SITE_BRANCH || 'master' }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://digitaltechadviser.com' }}
          DEVIN_MODEL: ${{ vars.DEVIN_MODEL || '' }}
          DEVIN_PERMISSION_MODE: ${{ vars.DEVIN_PERMISSION_MODE || 'dangerous' }}
          PUBLISH_MODE: ${{ inputs.publish_mode || vars.PUBLISH_MODE || 'publish' }}
          ENGINE_MAX_ARTICLES: ${{ inputs.max_articles || vars.ENGINE_MAX_ARTICLES || '1' }}
          DRY_RUN: ${{ inputs.dry_run || vars.DRY_RUN || 'false' }}
          BUILD_VERIFY: ${{ vars.BUILD_VERIFY || 'true' }}
          VERIFY_TIMEOUT_MIN: ${{ vars.VERIFY_TIMEOUT_MIN || '15' }}
          NOTIFY_ISSUES: ${{ vars.NOTIFY_ISSUES || 'true' }}
          ARTICLE_CATEGORY: ${{ vars.ARTICLE_CATEGORY || 'ai' }}
          RUN_ATTEMPT: ${{ inputs.attempt || '1' }}
        run: python -m engine run

      - name: Failure notification
        if: failure() && steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TODAY=$(date +%F)
          TITLE="Engine run failed: $TODAY"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$TITLE\"" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" \
              --body "Another failed attempt: $RUN_URL" || true
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --label engine-failure \
              --body "Pipeline step failed.\n\nRun: $RUN_URL\n\nCheck the job log for the sanitized error tail." || true
          fi

      - name: Workspace cleanup audit
        if: always()
        run: |
          # Evidence for the no-retention policy: list anything left outside
          # the engine checkout that the pipeline could have written.
          echo "temp dirs matching dta-engine-*:"
          ls -d /tmp/dta-engine-* 2>/dev/null && echo "LEFTOVER FOUND" && exit 1 || echo "none — clean"
