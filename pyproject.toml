[project]
name = "dta-ai-skills-engine"
version = "0.1.0"
description = "Autonomous multi-agent AI-skills content engine for digitaltechadviser.com"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["F", "I", "UP", "SIM", "RUF", "FURB"]
ignore = [
    "RUF001",   # ambiguous unicode in strings (em/en dashes are deliberate)
    "RUF002",   # same in docstrings
]
